<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestor de Tareas{% endblock %} | TaskManager</title>
    <!-- Tailwind CSS vía CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="flex flex-col min-h-screen font-sans text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Barra de Navegación -->
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logotipo / Título -->
                <a href="{% url 'tasks:lista_tareas' %}" class="flex items-center gap-2 group">
                    <span class="p-2 bg-indigo-600 text-white rounded-lg shadow-sm group-hover:bg-indigo-700 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                    </span>
                    <span class="font-bold text-xl tracking-tight text-slate-900 group-hover:text-indigo-600 transition">
                        Task<span class="text-indigo-600">Manager</span>
                    </span>
                </a>

                <!-- Acciones Rápidas -->
                <div class="flex items-center gap-3">
                    <a href="/admin/" target="_blank" class="text-sm font-medium text-slate-600 hover:text-slate-900 px-3 py-2 rounded-lg hover:bg-slate-100 transition hidden sm:inline-flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Admin
                    </a>
                    <a href="{% url 'tasks:crear_tarea' %}" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2 rounded-lg shadow-sm shadow-indigo-200 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Nueva Tarea
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenedor de Mensajes Flash (Django Messages) -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full mt-4">
        {% if messages %}
            <div class="space-y-3">
                {% for message in messages %}
                    <div class="flex items-center justify-between p-4 rounded-xl shadow-xs border transition
                        {% if message.tags == 'success' %}
                            bg-emerald-50 border-emerald-200 text-emerald-800
                        {% elif message.tags == 'warning' %}
                            bg-amber-50 border-amber-200 text-amber-800
                        {% elif message.tags == 'error' %}
                            bg-rose-50 border-rose-200 text-rose-800
                        {% else %}
                            bg-indigo-50 border-indigo-200 text-indigo-800
                        {% endif %}"
                        role="alert">
                        <div class="flex items-center gap-3">
                            <span class="p-1 rounded-full 
                                {% if message.tags == 'success' %}bg-emerald-200 text-emerald-900
                                {% elif message.tags == 'warning' %}bg-amber-200 text-amber-900
                                {% elif message.tags == 'error' %}bg-rose-200 text-rose-900
                                {% else %}bg-indigo-200 text-indigo-900{% endif %}">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            </span>
                            <span class="text-sm font-medium">{{ message }}</span>
                        </div>
                        <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Pie de Página -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto px-4">
            Django Task Manager &bull; Arquitectura POO con SQLite &bull; Python 3.14
        </div>
    </footer>

</body>
</html>
