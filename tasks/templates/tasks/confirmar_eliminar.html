{% extends "tasks/base.html" %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl border border-rose-100 shadow-sm overflow-hidden p-6 text-center space-y-4">
        
        <div class="w-14 h-14 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center mx-auto">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h1 class="text-lg font-bold text-slate-900">¿Eliminar esta tarea?</h1>
        
        <p class="text-sm text-slate-600">
            Estás a punto de eliminar permanentemente la tarea:
            <span class="block font-semibold text-slate-900 mt-1 italic">"{{ tarea.titulo }}"</span>
        </p>

        <form method="POST" action="{% url 'tasks:eliminar_tarea' tarea.pk %}" class="flex items-center justify-center gap-3 pt-3">
            {% csrf_token %}
            <a href="{% url 'tasks:lista_tareas' %}" class="px-4 py-2.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium text-sm transition">
                Cancelar
            </a>
            <button type="submit" class="px-5 py-2.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-medium text-sm shadow-sm transition">
                Sí, eliminar
            </button>
        </form>

    </div>
</div>
{% endblock %}
